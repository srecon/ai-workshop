<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Wealth Dashboard{% endblock %}</title>
    <!-- Tailwind CSS via CDN (IntelliInvoice design language) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Plotly.js for charts -->
    <script src="https://cdn.plot.ly/plotly-3.0.1.min.js" charset="utf-8"></script>
    <!-- Custom scrollbar styles -->
    <style>
        /* Custom Scrollbar for better aesthetics */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        .chart-container {
            min-height: 300px;
        }
        /* Phase 3: Typography scale — metric values + subdued labels */
        .metric-value {
            font-feature-settings: 'tnum';
            letter-spacing: -0.02em;
        }
        .label-text {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.15em;
        }
    </style>
</head>
<body class="min-h-screen font-sans text-slate-900" style="background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);">
    <div class="flex h-screen overflow-hidden">

        <!-- Sidebar -->
        <aside class="w-64 bg-slate-900 text-slate-300 flex flex-col shadow-2xl z-10 hidden md:flex">
            <div class="p-6 border-b border-slate-800 flex items-center gap-3">
                <div class="bg-indigo-600 p-2 rounded-lg">
                    <span class="text-white text-lg">💰</span>
                </div>
                <span class="font-bold text-lg text-white tracking-tight">Wealth Dashboard</span>
            </div>

            <nav class="flex-1 p-4 space-y-1">
                <a href="/" class="w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition-all duration-200 {% if request.path == '/' %}bg-indigo-600/10 text-indigo-400 border-r-2 border-indigo-500{% else %}text-slate-400 hover:text-slate-200 hover:bg-slate-800{% endif %}">
                    <span class="w-5 h-5">📊</span>
                    Dashboard
                </a>
                <a href="/upload" class="w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition-all duration-200 {% if request.path == '/upload' %}bg-indigo-600/10 text-indigo-400 border-r-2 border-indigo-500{% else %}text-slate-400 hover:text-slate-200 hover:bg-slate-800{% endif %}">
                    <span class="w-5 h-5">📤</span>
                    Upload
                </a>
                <div class="pt-4 pb-2">
                    <p class="px-4 text-xs font-semibold text-slate-500 uppercase tracking-wider">Settings</p>
                </div>
                <a href="/settings" class="w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition-all duration-200 {% if request.path == '/settings' %}bg-indigo-600/10 text-indigo-400 border-r-2 border-indigo-500{% else %}text-slate-400 hover:text-slate-200 hover:bg-slate-800{% endif %}">
                    <span class="w-5 h-5">⚙️</span>
                    Configuration
                </a>
            </nav>

            <div class="p-4 border-t border-slate-800">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-indigo-500 to-purple-500"></div>
                    <div>
                        <p class="text-sm font-medium text-white">Admin User</p>
                        <p class="text-xs text-slate-500">Finance Team</p>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col h-screen overflow-hidden">
            <!-- Top Header -->
            <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-6 lg:px-8">
                <div class="flex items-center gap-4">
                    <h1 class="text-xl font-bold text-slate-800">
                        {% block page_title %}Overview{% endblock %}
                    </h1>
                </div>

                <div class="flex items-center gap-4">
                    <div class="relative hidden sm:block">
                        <svg class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                        </svg>
                        <input
                            type="text"
                            placeholder="Search..."
                            class="pl-9 pr-4 py-2 bg-slate-100 border-transparent focus:bg-white border focus:border-indigo-500 rounded-full text-sm w-64 transition-all focus:outline-none"
                        />
                    </div>
                    <button class="p-2 text-slate-400 hover:text-slate-600 relative">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.171c0 .632-.244 1.217-.675 1.67L9 8m9 9H9"></path>
                        </svg>
                        <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-red-500 rounded-full border-2 border-white"></span>
                    </button>
                </div>
            </header>

            <!-- Scrollable Content Area -->
            <div class="flex-1 overflow-auto">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>

    {% block scripts %}{% endblock %}
</body>
</html>
