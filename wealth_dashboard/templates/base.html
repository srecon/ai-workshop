<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Wealth Dashboard{% endblock %}</title>
    <!-- Prevent Flash of Unstyled Content — inject theme synchronously -->
    <script>(function(){try{var t=localStorage.getItem("wd_theme");if(t){document.documentElement.setAttribute("data-theme",t)}}catch(e){}})()</script>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Plotly.js for charts -->
    <script src="https://cdn.plot.ly/plotly-3.0.1.min.js" charset="utf-8"></script>
    <!-- Custom Styles — CSS Variables + Utilities -->
    <style>
        /* ═══════════════════════════════════════════
           LIGHT THEME TOKENS
           ═══════════════════════════════════════════ */
        :root {
            --wd-bg-primary: #ffffff;
            --wd-bg-secondary: #f8fafc;
            --wd-bg-sidebar: #f1f5f9;
            --wd-bg-card: rgba(255, 255, 255, 0.75);
            --wd-bg-overlay: rgba(255, 255, 255, 0.95);
            --wd-border-subtle: #e2e8f0;
            --wd-accent: #4f46e5;
            --wd-accent-hover: #4338ca;
            --wd-accent-light: rgba(79, 70, 229, 0.08);
            --wd-text-primary: #0f172a;
            --wd-text-secondary: #475569;
            --wd-text-muted: #94a3b8;
            --wd-focus-ring: #6366f1;
            --wd-success: #10b981;
            --wd-warning: #f59e0b;
            --wd-error: #ef4444;
            --wd-chart-grid: rgba(0, 0, 0, 0.06);
            --wd-shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
            --wd-shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -1px rgba(0, 0, 0, 0.04);
            --wd-shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -2px rgba(0, 0, 0, 0.03);
            --wd-sidebar-width: 256px;
            --wd-transition-speed: 200ms;
        }

        /* ═══════════════════════════════════════════
           DARK THEME TOKENS
           ═══════════════════════════════════════════ */
        [data-theme="dark"] {
            --wd-bg-primary: #0f172a;
            --wd-bg-secondary: #1e293b;
            --wd-bg-sidebar: #020617;
            --wd-bg-card: rgba(30, 41, 59, 0.75);
            --wd-bg-overlay: rgba(15, 23, 42, 0.97);
            --wd-border-subtle: #1e293b;
            --wd-accent: #818cf8;
            --wd-accent-hover: #a5b4fc;
            --wd-accent-light: rgba(129, 140, 248, 0.12);
            --wd-text-primary: #f8fafc;
            --wd-text-secondary: #94a3b8;
            --wd-text-muted: #475569;
            --wd-focus-ring: #a5b4fc;
            --wd-chart-grid: rgba(255, 255, 255, 0.06);
            --wd-shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
            --wd-shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.4);
            --wd-shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
        }

        /* ═══════════════════════════════════════════
           GLOBAL TRANSITIONS — smooth theme swap
           ═══════════════════════════════════════════ */
        *, *::before, *::after {
            transition: background-color var(--wd-transition-speed) ease,
                        color var(--wd-transition-speed) ease,
                        border-color var(--wd-transition-speed) ease,
                        box-shadow var(--wd-transition-speed) ease;
        }

        /* Disable transition during initial paint (FOUC prevention handled by sync script) */
        html:not(.no-transitions) * {
            transition-duration: var(--wd-transition-speed);
        }

        /* ═══════════════════════════════════════════
           SCROLLBAR STYLING
           ═══════════════════════════════════════════ */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--wd-bg-secondary); }
        ::-webkit-scrollbar-thumb {
            background: var(--wd-text-muted);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover { background: var(--wd-text-secondary); }

        /* ═══════════════════════════════════════════
           TYPOGRAPHY UTILITIES
           ═══════════════════════════════════════════ */
        .metric-value {
            font-feature-settings: 'tnum';
            letter-spacing: -0.02em;
        }
        .label-text {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.15em;
        }
        .chart-container { min-height: 300px; }

        /* ═══════════════════════════════════════════
           FOCUS RINGS — WCAG AA visible focus
           ═══════════════════════════════════════════ */
        *:focus-visible {
            outline: 3px solid var(--wd-focus-ring);
            outline-offset: 2px;
            border-radius: 4px;
        }

        /* ═══════════════════════════════════════════
           LAYOUT — Desktop (≥768px): Persistent Sidebar
           ═══════════════════════════════════════════ */
        .app-layout {
            display: flex;
            height: 100vh;
            overflow: hidden;
            background-color: var(--wd-bg-primary);
        }

        .app-sidebar {
            width: var(--wd-sidebar-width);
            background-color: var(--wd-bg-sidebar);
            color: var(--wd-text-secondary);
            display: flex;
            flex-direction: column;
            box-shadow: var(--wd-shadow-lg);
            z-index: 30;
            border-right: 1px solid var(--wd-border-subtle);
        }

        .app-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            background-color: var(--wd-bg-primary);
        }

        .app-header {
            height: 64px;
            background-color: var(--wd-bg-card);
            backdrop-filter: saturate(180%) blur(10px);
            -webkit-backdrop-filter: saturate(180%) blur(10px);
            border-bottom: 1px solid var(--wd-border-subtle);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.5rem 0 1.5rem;
        }

        .app-content {
            flex: 1;
            overflow-y: auto;
        }

        /* ═══════════════════════════════════════════
           SIDEBAR NAVIGATION LINKS
           ═══════════════════════════════════════════ */
        .nav-link {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--wd-text-muted);
            text-decoration: none;
            cursor: pointer;
        }
        .nav-link:hover {
            color: var(--wd-text-primary);
            background-color: var(--wd-accent-light);
        }
        .nav-link.active {
            color: var(--wd-accent);
            background-color: var(--wd-accent-light);
        }
        .nav-section-title {
            padding: 1rem 1rem 0.5rem;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--wd-text-muted);
        }

        /* ═══════════════════════════════════════════
           MOBILE (<768px): Hidden Sidebar + Hamburger
           ═══════════════════════════════════════════ */
        .hamburger-btn {
            display: none;
            width: 40px;
            height: 40px;
            align-items: center;
            justify-content: center;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--wd-text-primary);
            padding: 0.5rem;
            border-radius: 0.5rem;
        }
        .hamburger-btn:hover {
            background-color: var(--wd-accent-light);
        }
        .hamburger-icon {
            display: block;
            width: 24px;
            height: 24px;
        }
        .hamburger-icon span {
            display: block;
            width: 100%;
            height: 2px;
            background-color: currentColor;
            border-radius: 1px;
            margin: 5px 0;
            transition: transform 250ms ease, opacity 250ms ease;
        }

        /* Hamburger animation when open */
        .hamburger-btn.open span:nth-child(1) {
            transform: translateY(7px) rotate(45deg);
        }
        .hamburger-btn.open span:nth-child(2) {
            opacity: 0;
        }
        .hamburger-btn.open span:nth-child(3) {
            transform: translateY(-7px) rotate(-45deg);
        }

        /* ═══════════════════════════════════════════
           MOBILE DRAWER OVERLAY
           ═══════════════════════════════════════════ */
        .drawer-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 40;
            opacity: 0;
            transition: opacity 250ms ease;
        }
        .drawer-backdrop.visible {
            opacity: 1;
        }

        .drawer-panel {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 50;
            transform: translateX(-100%);
            transition: transform 250ms cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
            overscroll-behavior: contain;
        }
        .drawer-panel.open {
            transform: translateX(0);
        }

        /* Hide sidebar on mobile, show hamburger */
        @media (max-width: 767px) {
            .app-sidebar { display: none; }
            .hamburger-btn { display: flex; }
            .drawer-backdrop { display: block; }
            .drawer-panel { display: block; }
            .app-header { padding-left: 1rem; }
        }

        /* Show sidebar on desktop, hide hamburger */
        @media (min-width: 768px) {
            .hamburger-btn { display: none !important; }
            .drawer-backdrop { display: none !important; }
            .drawer-panel { display: none !important; }
        }

        /* ═══════════════════════════════════════════
           THEME TOGGLE BUTTON
           ═══════════════════════════════════════════ */
        .theme-toggle {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: none;
            border: 1px solid var(--wd-border-subtle);
            border-radius: 0.5rem;
            cursor: pointer;
            color: var(--wd-text-secondary);
        }
        .theme-toggle:hover {
            color: var(--wd-text-primary);
            border-color: var(--wd-accent);
        }
        .icon-sun, .icon-moon {
            width: 20px;
            height: 20px;
        }
        [data-theme="dark"] .icon-sun { display: none; }
        [data-theme="light"] .icon-moon { display: none; }

        /* ═══════════════════════════════════════════
           SEARCH BAR
           ═══════════════════════════════════════════ */
        .search-input-wrapper {
            position: relative;
        }
        .search-input {
            padding-left: 2.25rem;
            padding-right: 1rem;
            padding-top: 0.5rem;
            padding-bottom: 0.5rem;
            background-color: var(--wd-bg-secondary);
            border: 1px solid transparent;
            border-radius: 9999px;
            font-size: 0.875rem;
            color: var(--wd-text-primary);
            width: 16rem;
        }
        .search-input:focus {
            background-color: var(--wd-bg-primary);
            border-color: var(--wd-accent);
            outline: none;
        }
        .search-icon {
            position: absolute;
            left: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            color: var(--wd-text-muted);
            pointer-events: none;
        }

        /* ═══════════════════════════════════════════
           SKELETON LOADER — pulse animation
           ═══════════════════════════════════════════ */
        @keyframes wd-pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        .skeleton {
            background: linear-gradient(90deg,
                var(--wd-bg-secondary) 25%,
                var(--wd-border-subtle) 50%,
                var(--wd-bg-secondary) 75%);
            background-size: 200% 100%;
            animation: wd-pulse 1.5s ease-in-out infinite;
            border-radius: 0.5rem;
        }
        .chart-skeleton {
            width: 100%;
            height: 300px;
            border-radius: 1rem;
        }

        /* ═══════════════════════════════════════════
           TOAST NOTIFICATIONS
           ═══════════════════════════════════════════ */
        .toast-container {
            position: fixed;
            top: 1rem;
            right: 1rem;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .toast {
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            font-size: 0.875rem;
            box-shadow: var(--wd-shadow-lg);
            animation: wd-toast-in 300ms ease forwards;
            max-width: 24rem;
        }
        .toast.toast-fadeout {
            animation: wd-toast-out 300ms ease forwards;
        }
        .toast-success {
            background-color: var(--wd-success);
            color: white;
        }
        .toast-error {
            background-color: var(--wd-error);
            color: white;
        }
        .toast-info {
            background-color: var(--wd-accent);
            color: white;
        }
        @keyframes wd-toast-in {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes wd-toast-out {
            from { opacity: 1; transform: translateY(0); }
            to { opacity: 0; transform: translateY(-10px); }
        }

        /* ═══════════════════════════════════════════
           PROGRESS BAR (upload)
           ═══════════════════════════════════════════ */
        .progress-bar-fill {
            height: 4px;
            border-radius: 2px;
            background: linear-gradient(90deg, var(--wd-accent), var(--wd-accent-hover));
            transition: width 300ms ease;
        }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">

        <!-- ═════════════ DESKTOP SIDEBAR (≥768px) ═════════════ -->

                    </svg>
                    Configuration
                </a>
            </nav>

            <!-- Footer/User Info -->
            <div class="p-4" style="border-top: 1px solid var(--wd-border-subtle)">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-full" style="background: linear-gradient(to top right, var(--wd-accent), #a855f7)"></div>
                    <div>
                        <p class="text-sm font-medium" style="color: var(--wd-text-primary)">Admin User</p>
                        <p class="text-xs" style="color: var(--wd-text-muted)">Finance Team</p>
                    </div>
                </div>
            </div>
        </aside>

        <!-- ═════════════ MOBILE DRAWER PANEL (<768px) ═════════════ -->

            <div class="app-sidebar" style="height: 100%">
                <div class="p-6 border-b" style="border-color: var(--wd-border-subtle)">

                                <span class="text-white text-lg">💰</span>

                </div>

                        Dashboard

                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/>
                        </svg>
                        Upload
                    </a>
                    <div class="nav-section-title">Settings</div>
                    <a href="/settings" class="nav-link {% if request.path == '/settings' %}active{% endif %}">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                        </svg>
                        Configuration
                    </a>
                </nav>
                <div class="p-4" style="border-top: 1px solid var(--wd-border-subtle)">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded-full" style="background: linear-gradient(to top right, var(--wd-accent), #a855f7)"></div>
                        <div>
                            <p class="text-sm font-medium" style="color: var(--wd-text-primary)">Admin User</p>
                            <p class="text-xs" style="color: var(--wd-text-muted)">Finance Team</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ═════════════ MAIN CONTENT AREA ═════════════ -->
        <div class="app-main">
            <!-- Top Header -->
            <header class="app-header" role="banner">
                <div class="flex items-center gap-3">
                    <!-- Hamburger (mobile only) -->
                    <button class="hamburger-btn" id="hamburgerBtn" aria-label="Open navigation menu" aria-expanded="false" aria-controls="drawerPanel">
                        <svg class="hamburger-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                        </svg>
                    </button>
                    <!-- Page Title -->
                    <h1 class="text-xl font-bold" style="color: var(--wd-text-primary)">
                        {% block page_title %}Overview{% endblock %}
                    </h1>
                </div>

                <div class="flex items-center gap-3">
                    <!-- Search Bar (desktop only) -->
                    <div class="search-input-wrapper hidden sm:block">
                        <svg class="search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                        </svg>
                        <input
                            type="text"
                            placeholder="Search..."
                            class="search-input"
                            style="padding-left: 2.25rem;"
                            aria-label="Search"
                        />
                    </div>

                    <!-- Notification Bell -->
                    <button class="p-2 text-secondary relative" style="color: var(--wd-text-secondary);" aria-label="Notifications">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.171c0 .632-.244 1.217-.675 1.67L9 8m9 9H9"/>
                        </svg>
                        <span class="absolute top-1.5 right-1.5 w-2 h-2 rounded-full" style="background-color: var(--wd-error); border: 2px solid var(--wd-bg-card)"></span>
                    </button>

                    <!-- Theme Toggle -->
                    <button class="theme-toggle" id="themeToggle" role="switch" aria-checked="false" aria-label="Toggle theme">
                        <!-- Sun icon (shown in dark mode) -->
                        <svg class="icon-sun" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
                        </svg>
                        <!-- Moon icon (shown in light mode) -->
                        <svg class="icon-moon" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
                        </svg>
                    </button>
                </div>
            </header>

            <!-- Scrollable Content Area -->
            <div class="app-content">
                {% block content %}{% endblock %}
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer" aria-live="polite" aria-atomic="true"></div>

    <!-- Global Scripts — Navigation, Theme, Drawer -->
    {% block scripts %}{% endblock %}
    <script>
    (function() {
        'use strict';

        /* ═══════════════════════════════════════════
           THEME TOGGLE (Task 1.4, 1.5, 1.6)
           ═══════════════════════════════════════════ */
        var themeToggle = document.getElementById('themeToggle');
        var htmlEl = document.documentElement;

        function getPreferredTheme() {
            try { return localStorage.getItem('wd_theme'); } catch(e) { return null; }
        }

        function applyTheme(theme) {
            htmlEl.setAttribute('data-theme', theme);
            themeToggle.setAttribute('aria-checked', theme === 'light' ? 'true' : 'false');
            try { localStorage.setItem('wd_theme', theme); } catch(e) {}
        }

        // Initialize theme — respect stored pref, then OS preference, default dark
        (function initTheme() {
            var stored = getPreferredTheme();
            if (stored) {
                applyTheme(stored);
            } else {
                var osDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                applyTheme(osDark ? 'dark' : 'light');
            }
            // Remove no-transitions class after paint to enable transitions
            requestAnimationFrame(function() {
                htmlEl.classList.remove('no-transitions');
            });
        })();

        // Toggle handler
        if (themeToggle) {
            themeToggle.addEventListener('click', function() {
                var current = htmlEl.getAttribute('data-theme');
                applyTheme(current === 'dark' ? 'light' : 'dark');
            });
        }

        /* ═══════════════════════════════════════════
           RESPONSIVE DRAWER (Task 2.3–2.7)
           ═══════════════════════════════════════════ */
        var hamburgerBtn = document.getElementById('hamburgerBtn');
        var drawerPanel = document.getElementById('drawerPanel');
        var drawerBackdrop = document.getElementById('drawerBackdrop');
        var drawerOpen = false;
        var previousFocus = null;

        function openDrawer() {
            if (drawerOpen) return;
            drawerOpen = true;
            previousFocus = document.activeElement;

            drawerPanel.style.pointerEvents = 'auto';
            drawerPanel.classList.add('open');
            drawerBackdrop.classList.add('visible');
            hamburgerBtn.classList.add('open');
            hamburgerBtn.setAttribute('aria-expanded', 'true');

            // Trap focus inside drawer
            var firstLink = drawerPanel.querySelector('a[href], button');
            if (firstLink) firstLink.focus();

            // Listen for Escape key
            document.addEventListener('keydown', handleDrawerKeydown);
        }

        function closeDrawer(returnFocus) {
            if (!drawerOpen) return;
            drawerOpen = false;

            drawerPanel.classList.remove('open');
            drawerBackdrop.classList.remove('visible');
            hamburgerBtn.classList.remove('open');
            hamburgerBtn.setAttribute('aria-expanded', 'false');

            document.removeEventListener('keydown', handleDrawerKeydown);

            if (returnFocus && previousFocus) {
                previousFocus.focus();
            }
        }

        function handleDrawerKeydown(e) {
            if (e.key === 'Escape') {
                closeDrawer(true);
                return;
            }
            // Focus trap
            if (e.key === 'Tab') {
                var focusable = drawerPanel.querySelectorAll('a[href], button:not([disabled]), input');
                var first = focusable[0];
                var last = focusable[focusable.length - 1];
                if (e.shiftKey && document.activeElement === first) {
                    e.preventDefault();
                    last.focus();
                } else if (!e.shiftKey && document.activeElement === last) {
                    e.preventDefault();
                    first.focus();
                }
            }
        }

        if (hamburgerBtn) {
            hamburgerBtn.addEventListener('click', openDrawer);
        }
        if (drawerBackdrop) {
            drawerBackdrop.addEventListener('click', function() { closeDrawer(false); });
        }
        // Close buttons inside drawer
        var closeButtons = drawerPanel.querySelectorAll('.close-drawer');
        closeButtons.forEach(function(btn) {
            btn.addEventListener('click', function() { closeDrawer(true); });
        });

        // Closing drawer on navigation link click (Task 2.7)
        var drawerLinks = drawerPanel ? drawerPanel.querySelectorAll('.nav-link') : [];
        drawerLinks.forEach(function(link) {
            link.addEventListener('click', function() {
                closeDrawer(false);
            });
        });

        /* ═══════════════════════════════════════════
           TOAST NOTIFICATION UTILITY (Task 5.3)
           ═══════════════════════════════════════════ */
        window.showToast = function(message, type) {
            type = type || 'success';
            var container = document.getElementById('toastContainer');
            if (!container) return;
            var toast = document.createElement('div');
            toast.className = 'toast toast-' + type;
            toast.textContent = message;
            toast.setAttribute('role', 'alert');
            container.appendChild(toast);
            // Auto-remove after 3 seconds
            setTimeout(function() {
                toast.classList.add('toast-fadeout');
                setTimeout(function() {
                    if (toast.parentNode) toast.parentNode.removeChild(toast);
                }, 300);
            }, 3000);
        };

    })();
    </script>
</body>
</html>
